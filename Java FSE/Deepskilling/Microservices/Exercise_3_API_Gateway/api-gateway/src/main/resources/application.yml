server:
  port: 9090

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: customer-route
          uri: http://localhost:8085
          predicates:
            - Path=/api/customers/**
          filters:
            - RewritePath=/api/customers/(?<segment>.*), /customers/$\{segment}
            - AddResponseHeader=Cache-Control, max-age=3600
            - RateLimit=5,10
        - id: billing-route
          uri: http://localhost:8086
          predicates:
            - Path=/api/billing/**
          filters:
            - RewritePath=/api/billing/(?<segment>.*), /billing/$\{segment}
            - AddResponseHeader=Cache-Control, max-age=3600
            - RateLimit=5,10
